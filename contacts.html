    <header>
        <h1>Welocme to little taco shop</h1>
        <nav>
            <ul>
                <li>

    <hr>
    <main>
        <section>
            <h2>Our contact form</h2>
            <form action="https://httpbin.org/get" method="get">
                <fieldset>
                    <legend>Send us a messge</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" placeholder="your name" required>
                    </p>
                    <p>
                        <label for="E-mail">E-mail:</label>
                        <input type="email" name="email" id="email" placeholder="your E-mail" required>
                    </p>
                    <p>
                        <label for="messge">Your message:</label>
                        <br>
                        <br>
                        <textarea name="message" id="message" placeholder="type your message here" cols="30"
                            rows="10"></textarea>
                    </p>
                    <p>
                        <a href="#">Back to Top</a>
                    </p>
                </fieldset>
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </form>
        </section>
        <section>
            <h2>Our location</h2>
            <address>
                555 Taco Temptation Lane,Suite T<br>
                canada city, MO 55555-55
                <br><br>
                phone:<a href="tel:+5555555">55555-55</a>
            </address>
        </section>
